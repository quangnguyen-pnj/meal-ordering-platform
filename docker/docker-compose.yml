# Whole system for development and demos:
#   cp .env.example .env        (optional: every variable has a development default here)
#   docker compose -f docker/docker-compose.yml --env-file .env up --build
# then open http://localhost:8080 (NGINX_PORT).
#
# This stack uses NODE_ENV=development so the mock Microsoft sign-in, fake time and the seed work.
# For a real deployment set NODE_ENV=production, ENTRA_MODE=oidc, a real SESSION_SECRET and
# SEED_ON_START=false (the api refuses to start otherwise).

name: meal

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meal_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-meal}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  # Java API (apps/api). Flyway migrates the schema on start; the seed runs when SEED_ON_START=true.
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      TZ: Asia/Ho_Chi_Minh
      DATABASE_URL: postgresql://${POSTGRES_USER:-meal}:${POSTGRES_PASSWORD:-meal_dev_password}@postgres:5432/${POSTGRES_DB:-meal}?schema=public
      # A volume made by the NestJS API of P0-P2 already has the V1-V3 schema (development only).
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-true}
      API_PORT: '3001'
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-dev-only-change-me-dev-only}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CLOCK_FAKE_ENABLED: ${CLOCK_FAKE_ENABLED:-true}
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      FIRST_SYSTEM_ADMIN_CODE: ${FIRST_SYSTEM_ADMIN_CODE:-PNJP000004}
      ENTRA_MODE: ${ENTRA_MODE:-mock}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:-}
      DMP_MODE: ${DMP_MODE:-mock}
      DMP_MOCK_SCENARIO: ${DMP_MOCK_SCENARIO:-on-time}
      DMP_BASE_URL: ${DMP_BASE_URL:-}
      DMP_SERVICE_EMAIL: ${DMP_SERVICE_EMAIL:-}
      DMP_SERVICE_PASSWORD: ${DMP_SERVICE_PASSWORD:-}
      DMP_COMPANY_CODE: ${DMP_COMPANY_CODE:-}
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_INITIAL_PIN: ${SEED_INITIAL_PIN:-123456}
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3001/api/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:3001
      TZ: Asia/Ho_Chi_Minh

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - '${NGINX_PORT:-8080}:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
