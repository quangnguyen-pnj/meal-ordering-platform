# Same-domain reverse proxy (plan section 6): / goes to the web app, /api to the API.
# The browser only ever talks to this server; the API is the only component that calls DMP and Entra.

upstream meal_web {
    server web:3000;
}

upstream meal_api {
    server api:3001;
}

# Plain HTTP is for local demos only. In production TLS must terminate here (listen 443 ssl, a
# 301 from port 80, and `add_header Strict-Transport-Security "max-age=31536000" always;`) or at a
# load balancer in front of it: the PIN travels in the sign-in request body, and only HTTPS keeps
# it off the network. The api refuses to start in production without COOKIE_SECURE=true.
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Excel imports: the API accepts 5 MB per file and 6 MB per request.
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://meal_api;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://meal_web;
    }
}
