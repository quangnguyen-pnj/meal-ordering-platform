# Environment variables keep the names of .env.example. Locally the API also reads the file named
# by MEAL_ENV_FILE (the pnpm scripts point it at the repository's .env).
spring:
  application:
    name: meal-api
  config:
    import: optional:file:${MEAL_ENV_FILE:.env}[.properties]
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  # Excel uploads (mapping, dish library) are limited to 5 MB, like the legacy API.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  # spring.datasource.* comes from DATABASE_URL (DatabaseUrlEnvironmentPostProcessor).
  datasource:
    hikari:
      # The JDBC driver opens sessions in the JVM's zone (Asia/Ho_Chi_Minh in Docker), and a column
      # default such as "createdAt" DEFAULT CURRENT_TIMESTAMP would then store Vietnam time in a UTC
      # column. Every session is UTC, like the stored timestamps (plan 7.1 rule 4).
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
      naming:
        # The schema uses quoted camelCase names ("Employee"."employeeCode"), like Prisma made them.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        globally_quoted_identifiers: true
        # Timestamps are stored as UTC in TIMESTAMP(3) columns (plan 7.1 rule 4).
        jdbc.time_zone: UTC
  flyway:
    # Only for a development database created by the legacy API's `prisma migrate deploy`: it
    # already holds V1..V3, so Flyway records them instead of running them again.
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 3

# OpenAPI description of the API at /api/openapi.json (the web's types are generated from it in
# J3). Off unless API_DOCS_ENABLED=true; .env.example turns it on for development.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
    path: /api/openapi.json
  # Sorted keys keep apps/api/openapi.json (the web's types are generated from it) stable.
  writer-with-order-by-keys: true

server:
  port: ${API_PORT:3001}
  # Behind nginx: trust X-Forwarded-* so secure cookies and client IPs work.
  forward-headers-strategy: native
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

meal:
  environment: ${APP_ENV:${NODE_ENV:development}}
  app-base-url: ${APP_BASE_URL:http://localhost:8080}
  session-secret: ${SESSION_SECRET:}
  session-ttl-hours: ${SESSION_TTL_HOURS:12}
  cookie-secure: ${COOKIE_SECURE:false}
  clock-fake-enabled: ${CLOCK_FAKE_ENABLED:false}
  jobs-enabled: ${JOBS_ENABLED:true}
  first-system-admin-code: ${FIRST_SYSTEM_ADMIN_CODE:}
  entra:
    mode: ${ENTRA_MODE:mock}
    tenant-id: ${ENTRA_TENANT_ID:}
    client-id: ${ENTRA_CLIENT_ID:}
    client-secret: ${ENTRA_CLIENT_SECRET:}
    redirect-uri: ${ENTRA_REDIRECT_URI:}
  seed:
    initial-pin: ${SEED_INITIAL_PIN:123456}
    on-start: ${SEED_ON_START:false}
  dmp:
    mode: ${DMP_MODE:mock}
    mock-scenario: ${DMP_MOCK_SCENARIO:on-time}
    base-url: ${DMP_BASE_URL:}
    service-email: ${DMP_SERVICE_EMAIL:}
    service-password: ${DMP_SERVICE_PASSWORD:}
    company-code: ${DMP_COMPANY_CODE:}
